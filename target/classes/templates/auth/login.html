<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Owner Login – SalonFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-box">
        <div class="auth-logo">
            <div class="auth-logo-icon">✂️</div>
            <div class="auth-logo-title">SalonFlow</div>
            <div class="auth-logo-sub">Owner Portal</div>
        </div>

        <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>
        <div th:if="${logoutMessage}" class="alert alert-info" th:text="${logoutMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success">
            <strong>🎉 Welcome to SalonFlow!</strong><br/>
            <span th:text="${successMessage}"></span><br/>
            <strong>Save your Salon Code — employees will need it to log in.</strong>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="text" name="username" class="form-control"
                       placeholder="owner@salon.com or admin" required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="••••••••" required/>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg mt-2">
                🔐 Sign In as Owner
            </button>
        </form>


        <p style="text-align:center; margin-top:20px; font-size:.88rem; color:var(--text-muted);">
            New salon? <a th:href="@{/register}" style="color:var(--primary); font-weight:600;">Register here</a>
        </p>
    </div>
</div>
</body>
</html>
