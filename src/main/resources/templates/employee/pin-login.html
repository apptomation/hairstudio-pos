<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Employee PIN – SalonFlow POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="pin-page">
    <div class="pin-box">
        <div style="font-size:2rem; margin-bottom:4px;">✂️</div>
        <h2 style="font-size:1.1rem; font-weight:700;" th:text="${salonName}">Salon Name</h2>
        <p style="font-size:.8rem; color:var(--text-muted); margin-top:4px;">
            Code: <strong th:text="${salonCode}">BEAUTY001</strong>
        </p>

        <div th:if="${error}" class="alert alert-danger mt-2" style="text-align:left;" th:text="${error}"></div>

        <p style="font-size:.9rem; color:var(--text-muted); margin-top:20px;">Enter your Employee PIN</p>

        <div class="pin-display" id="pinDisplay">────</div>

        <form th:action="@{/pos/pin}" method="post" id="pinForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="pin" id="pinValue"/>
        </form>

        <div class="pin-grid">
            <button class="pin-key" onclick="addPin('1')">1</button>
            <button class="pin-key" onclick="addPin('2')">2</button>
            <button class="pin-key" onclick="addPin('3')">3</button>
            <button class="pin-key" onclick="addPin('4')">4</button>
            <button class="pin-key" onclick="addPin('5')">5</button>
            <button class="pin-key" onclick="addPin('6')">6</button>
            <button class="pin-key" onclick="addPin('7')">7</button>
            <button class="pin-key" onclick="addPin('8')">8</button>
            <button class="pin-key" onclick="addPin('9')">9</button>
            <button class="pin-key clear" onclick="clearPin()">⌫</button>
            <button class="pin-key" onclick="addPin('0')">0</button>
            <button class="pin-key submit" onclick="submitPin()">✓</button>
        </div>

        <p style="margin-top:20px; font-size:.8rem;">
            <a th:href="@{/pos/salon}" style="color:var(--text-muted);">← Change Salon Code</a>
        </p>
    </div>
</div>

<script>
    let pin = '';
    function updateDisplay() {
        const d = document.getElementById('pinDisplay');
        d.textContent = pin.length > 0
            ? '●'.repeat(pin.length).padEnd(4, '─').split('').join(' ')
            : '─ ─ ─ ─';
    }
    function addPin(digit) {
        if (pin.length < 6) { pin += digit; updateDisplay(); }
    }
    function clearPin() {
        pin = pin.slice(0, -1); updateDisplay();
    }
    function submitPin() {
        if (pin.length < 1) return;
        document.getElementById('pinValue').value = pin;
        document.getElementById('pinForm').submit();
    }
    updateDisplay();
</script>
</body>
</html>
