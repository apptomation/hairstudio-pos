<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>POS – CashFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="pos-layout">
    <!-- LEFT: Services -->
    <div class="pos-services">
        <div class="pos-header" style="border-radius:12px; margin-bottom:16px;">
            <div>
                <div class="pos-employee">👤 <strong th:text="${employee.name}">Employee</strong></div>
                <h1 style="margin-top:4px;" th:text="${salon.fullName}">Salon</h1>
            </div>
            <div style="display:flex; gap:8px;">
                <a th:href="@{/pos/switch}" class="btn btn-sm" style="background:rgba(255,255,255,.15); color:#fff;">Switch</a>
                <a th:href="@{/pos/exit}" class="btn btn-sm" style="background:rgba(255,255,255,.1); color:#fff;">Exit</a>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Services by category -->
        <div th:if="${categories.empty and services.empty}">
            <div class="card">
                <div class="card-body" style="text-align:center; padding:40px;">
                    <p style="font-size:2rem;">💅</p>
                    <p style="color:var(--text-muted); margin-top:8px;">No services configured yet.</p>
                    <p style="font-size:.85rem; color:var(--text-muted);">Ask the owner to add services in the dashboard.</p>
                </div>
            </div>
        </div>

        <!-- Uncategorized services -->
        <div th:unless="${services.empty}">
            <div th:each="category : ${categories}" class="category-section">
                <div class="category-title" th:text="${category.name}">Category</div>
                <div class="services-grid">
                    <div th:each="service : ${services}"
                         th:if="${service.category != null and service.category.id == category.id}">
                        <button type="button" class="service-btn"
                                th:data-id="${service.id}"
                                th:data-name="${service.name}"
                                th:data-price="${service.price}"
                                onclick="addToCart(this)">
                            <span class="service-btn-name" th:text="${service.name}">Service</span>
                            <span class="service-btn-price" th:text="'$' + ${service.price}">$0</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Services with no category -->
            <div class="category-section">
                <div class="category-title">Other Services</div>
                <div class="services-grid">
                    <div th:each="service : ${services}"
                         th:if="${service.category == null}">
                        <button type="button" class="service-btn"
                                th:data-id="${service.id}"
                                th:data-name="${service.name}"
                                th:data-price="${service.price}"
                                onclick="addToCart(this)">
                            <span class="service-btn-name" th:text="${service.name}">Service</span>
                            <span class="service-btn-price" th:text="'$' + ${service.price}">$0</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- RIGHT: Cart -->
    <div class="pos-sidebar">
        <div class="pos-cart-header">🛒 Current Order</div>
        <div class="pos-cart-items" id="cartItems">
            <div class="pos-empty" id="emptyCart">No services selected yet.<br/>Tap a service to add it.</div>
        </div>
        <div class="pos-cart-footer">
            <div class="pos-total">
                <span class="pos-total-label">Total</span>
                <span class="pos-total-amount" id="totalDisplay">$0.00</span>
            </div>
            <form th:action="@{/pos/checkout}" method="post" id="checkoutForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div id="serviceInputs"></div>
                <button type="submit" class="btn btn-success btn-full btn-lg" id="checkoutBtn" disabled>
                    💵 Charge & Complete
                </button>
            </form>
            <button onclick="clearCart()" class="btn btn-outline btn-full btn-sm mt-2" style="color:var(--danger); border-color:var(--danger);">
                Clear Cart
            </button>
        </div>
    </div>
</div>

<script>
    let cart = [];

    function addToCart(btn) {
        const id = btn.dataset.id;
        const name = btn.dataset.name;
        const price = parseFloat(btn.dataset.price);
        cart.push({ id, name, price });
        renderCart();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        renderCart();
    }

    function clearCart() {
        cart = [];
        renderCart();
    }

    function renderCart() {
        const cartItems = document.getElementById('cartItems');
        const emptyMsg = document.getElementById('emptyCart');
        const serviceInputs = document.getElementById('serviceInputs');
        const totalDisplay = document.getElementById('totalDisplay');
        const checkoutBtn = document.getElementById('checkoutBtn');

        if (cart.length === 0) {
            cartItems.innerHTML = '<div class="pos-empty">No services selected yet.<br/>Tap a service to add it.</div>';
            serviceInputs.innerHTML = '';
            totalDisplay.textContent = '$0.00';
            checkoutBtn.disabled = true;
            return;
        }

        let html = '';
        let total = 0;
        let inputs = '';

        cart.forEach((item, i) => {
            total += item.price;
            html += `<div class="cart-item">
                <span class="cart-item-name">${item.name}</span>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="cart-item-price">$${item.price.toFixed(2)}</span>
                    <button class="cart-remove" onclick="removeFromCart(${i})">✕</button>
                </div>
            </div>`;
            inputs += `<input type="hidden" name="serviceIds" value="${item.id}"/>`;
        });

        cartItems.innerHTML = html;
        serviceInputs.innerHTML = inputs;
        totalDisplay.textContent = '$' + total.toFixed(2);
        checkoutBtn.disabled = false;
    }
</script>
</body>
</html>
