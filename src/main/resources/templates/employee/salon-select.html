<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Business Code – CashFlow POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-box" style="max-width:400px;">
        <div class="auth-logo">
            <div class="auth-logo-icon">🖥️</div>
            <div class="auth-logo-title">POS Terminal</div>
            <div class="auth-logo-sub">Enter your Business Code to continue</div>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/pos/salon}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label class="form-label">Business Code</label>
                <input type="text" name="salonCode" class="form-control"
                       placeholder="e.g. BEAUTY001" required autofocus
                       style="text-transform:uppercase; font-size:1.1rem; font-weight:700; letter-spacing:.1em; text-align:center;"/>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg">
                Continue →
            </button>
        </form>

        <p style="text-align:center; margin-top:20px; font-size:.85rem; color:var(--text-muted);">
            <a th:href="@{/login}" style="color:var(--primary);">← Back to Owner Login</a>
        </p>
    </div>
</div>
</body>
</html>
