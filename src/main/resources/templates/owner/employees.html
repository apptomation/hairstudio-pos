<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Employees – SalonFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{layout :: ownerNav}" th:with="activePage='employees'"></div>

<div class="main">
    <div class="page-header">
        <div>
            <div class="page-title">Employees</div>
            <div class="page-subtitle">Manage your salon staff and PINs</div>
        </div>
        <button onclick="document.getElementById('addModal').style.display='flex'" class="btn btn-primary">
            + Add Employee
        </button>
    </div>

    <div class="page-content">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>PIN</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(employees)}">
                            <td colspan="5" style="text-align:center; color:var(--text-muted); padding:32px;">
                                No employees yet. Add your first employee!
                            </td>
                        </tr>
                        <tr th:each="emp : ${employees}">
                            <td class="fw-bold" th:text="${emp.name}">Name</td>
                            <td>
                                <span style="font-family:monospace; background:var(--bg); padding:3px 8px; border-radius:6px; font-size:.9rem;" th:text="${emp.pin}">PIN</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${emp.role.name() == 'OWNER' ? 'badge-primary' : 'badge-success'}" th:text="${emp.role}">EMPLOYEE</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${emp.active ? 'badge-success' : 'badge-danger'}" th:text="${emp.active ? 'Active' : 'Inactive'}">Active</span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline"
                                        th:data-id="${emp.id}"
                                        th:data-name="${emp.name}"
                                        th:data-pin="${emp.pin}"
                                        onclick="openEdit(this.dataset.id, this.dataset.name, this.dataset.pin)">
                                    Edit
                                </button>
                                <form th:action="@{/owner/employees/{id}/deactivate(id=${emp.id})}" method="post" style="display:inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-danger"
                                            th:if="${emp.active}"
                                            onclick="return confirm('Deactivate this employee?')">
                                        Deactivate
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add Employee Modal -->
<div id="addModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:16px; padding:32px; width:380px; max-width:90vw;">
        <h3 style="margin-bottom:20px;">Add New Employee</h3>
        <form th:action="@{/owner/employees/add}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Jana" required/>
            </div>
            <div class="form-group">
                <label class="form-label">PIN (4-6 digits)</label>
                <input type="text" name="pin" class="form-control" placeholder="e.g. 1234"
                       pattern="[0-9]{4,6}" maxlength="6" required/>
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="submit" class="btn btn-primary" style="flex:1;">Add Employee</button>
                <button type="button" onclick="document.getElementById('addModal').style.display='none'" class="btn btn-outline" style="flex:1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Employee Modal -->
<div id="editModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:16px; padding:32px; width:380px; max-width:90vw;">
        <h3 style="margin-bottom:20px;">Edit Employee</h3>
        <form id="editForm" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" id="editName" class="form-control" required/>
            </div>
            <div class="form-group">
                <label class="form-label">PIN</label>
                <input type="text" name="pin" id="editPin" class="form-control" pattern="[0-9]{4,6}" maxlength="6" required/>
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="submit" class="btn btn-primary" style="flex:1;">Save Changes</button>
                <button type="button" onclick="document.getElementById('editModal').style.display='none'" class="btn btn-outline" style="flex:1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
function openEdit(id, name, pin) {
    document.getElementById('editName').value = name;
    document.getElementById('editPin').value = pin;
    document.getElementById('editForm').action = '/owner/employees/' + id + '/edit';
    document.getElementById('editModal').style.display = 'flex';
}
</script>
</body>
</html>
