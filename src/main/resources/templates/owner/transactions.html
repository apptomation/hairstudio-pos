<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Transactions – SalonFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{layout :: ownerNav}" th:with="activePage='transactions'"></div>

<div class="main">
    <div class="page-header">
        <div class="page-title">All Transactions</div>
    </div>
    <div class="page-content">
        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Date & Time</th>
                            <th>Employee</th>
                            <th>Services</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${transactions.empty}">
                            <td colspan="6" style="text-align:center; color:var(--text-muted); padding:32px;">No transactions yet.</td>
                        </tr>
                        <tr th:each="tx : ${transactions}">
                            <td class="text-muted" th:text="'#' + ${tx.id}">1</td>
                            <td th:text="${#temporals.format(tx.createdAt, 'MMM d yyyy, HH:mm')}">Date</td>
                            <td th:text="${tx.employee.name}">Name</td>
                            <td>
                                <span th:each="item, i : ${tx.items}">
                                    <span th:text="${item.serviceName}">s</span><span th:if="${!i.last}">, </span>
                                </span>
                            </td>
                            <td class="fw-bold text-primary" th:text="'$' + ${tx.totalAmount}">$0</td>
                            <td>
                                <span th:if="${tx.status.name() == 'COMPLETED'}" class="badge badge-success">COMPLETED</span>
                                <span th:if="${tx.status.name() == 'CANCELLED'}" class="badge badge-danger">CANCELLED</span>
                                <span th:if="${tx.status.name() == 'REFUNDED'}" class="badge badge-warning">REFUNDED</span>
                            </td>
                            <td>
                                <form th:if="${tx.status.name() == 'COMPLETED'}"
                                      th:action="@{/owner/transactions/{id}/cancel(id=${tx.id})}"
                                      method="post"
                                      onsubmit="return confirm('Cancel transaction #' + /*[[${tx.id}]]*/ '?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-danger">Cancel</button>
                                </form>
                                <span th:if="${tx.status.name() != 'COMPLETED'}" style="color:var(--text-muted); font-size:.8rem;">—</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
