<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Services – SalonFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{layout :: ownerNav}" th:with="activePage='services'"></div>

<div class="main">
    <div class="page-header">
        <div>
            <div class="page-title">Services</div>
            <div class="page-subtitle">Manage services, prices and categories</div>
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="document.getElementById('addCategoryModal').style.display='flex'" class="btn btn-outline">
                + Category
            </button>
            <button onclick="document.getElementById('addServiceModal').style.display='flex'" class="btn btn-primary">
                + Add Service
            </button>
        </div>
    </div>

    <div class="page-content">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <!-- Categories Quick View -->
        <div th:if="${!#lists.isEmpty(categories)}" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
            <div th:each="cat : ${categories}"
                 style="background:var(--primary-lt); color:var(--primary); padding:6px 14px; border-radius:20px; font-size:.85rem; font-weight:600;">
                <span th:text="${cat.name}">Category</span>
            </div>
        </div>

        <div class="card">
            <div class="card-header">All Services</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Service Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(services)}">
                            <td colspan="5" style="text-align:center; color:var(--text-muted); padding:32px;">
                                No services yet. Add your first service!
                            </td>
                        </tr>
                        <tr th:each="svc : ${services}">
                            <td class="fw-bold" th:text="${svc.name}">Service</td>
                            <td>
                                <span th:if="${svc.category != null}" class="badge badge-primary" th:text="${svc.category.name}">Category</span>
                                <span th:if="${svc.category == null}" class="text-muted">—</span>
                            </td>
                            <td class="fw-bold text-primary" th:text="'$' + ${svc.price}">$0</td>
                            <td>
                                <span class="badge" th:classappend="${svc.active ? 'badge-success' : 'badge-danger'}" th:text="${svc.active ? 'Active' : 'Inactive'}">Active</span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline"
                                        th:data-id="${svc.id}"
                                        th:data-name="${svc.name}"
                                        th:data-price="${svc.price}"
                                        th:data-category-id="${svc.category != null ? svc.category.id : ''}"
                                        onclick="openEditService(this.dataset.id, this.dataset.name, this.dataset.price, this.dataset.categoryId)">
                                    Edit
                                </button>
                                <form th:action="@{/owner/services/{id}/toggle(id=${svc.id})}" method="post" style="display:inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm" th:classappend="${svc.active ? 'btn-danger' : 'btn-success'}" th:text="${svc.active ? 'Deactivate' : 'Activate'}">Toggle</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add Service Modal -->
<div id="addServiceModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:16px; padding:32px; width:400px; max-width:90vw;">
        <h3 style="margin-bottom:20px;">Add New Service</h3>
        <form th:action="@{/owner/services/add}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label class="form-label">Service Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Hair Cut" required/>
            </div>
            <div class="form-group">
                <label class="form-label">Price ($)</label>
                <input type="number" name="price" class="form-control" placeholder="20.00" step="0.01" min="0" required/>
            </div>
            <div class="form-group">
                <label class="form-label">Category (optional)</label>
                <select name="categoryId" class="form-control">
                    <option value="">No Category</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                </select>
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="submit" class="btn btn-primary" style="flex:1;">Add Service</button>
                <button type="button" onclick="document.getElementById('addServiceModal').style.display='none'" class="btn btn-outline" style="flex:1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Service Modal -->
<div id="editServiceModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:16px; padding:32px; width:400px; max-width:90vw;">
        <h3 style="margin-bottom:20px;">Edit Service</h3>
        <form id="editServiceForm" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label class="form-label">Service Name</label>
                <input type="text" name="name" id="editSvcName" class="form-control" required/>
            </div>
            <div class="form-group">
                <label class="form-label">Price ($)</label>
                <input type="number" name="price" id="editSvcPrice" class="form-control" step="0.01" min="0" required/>
            </div>
            <div class="form-group">
                <label class="form-label">Category</label>
                <select name="categoryId" class="form-control" id="editSvcCategory">
                    <option value="">No Category</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                </select>
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="submit" class="btn btn-primary" style="flex:1;">Save</button>
                <button type="button" onclick="document.getElementById('editServiceModal').style.display='none'" class="btn btn-outline" style="flex:1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Add Category Modal -->
<div id="addCategoryModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:16px; padding:32px; width:360px; max-width:90vw;">
        <h3 style="margin-bottom:20px;">Add Category</h3>
        <form th:action="@{/owner/categories/add}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label class="form-label">Category Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Hair Services" required/>
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="submit" class="btn btn-primary" style="flex:1;">Add</button>
                <button type="button" onclick="document.getElementById('addCategoryModal').style.display='none'" class="btn btn-outline" style="flex:1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
function openEditService(id, name, price, categoryId) {
    document.getElementById('editSvcName').value = name;
    document.getElementById('editSvcPrice').value = price;
    const sel = document.getElementById('editSvcCategory');
    sel.value = categoryId || '';
    document.getElementById('editServiceForm').action = '/owner/services/' + id + '/edit';
    document.getElementById('editServiceModal').style.display = 'flex';
}
</script>
</body>
</html>
