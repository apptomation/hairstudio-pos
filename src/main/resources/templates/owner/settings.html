<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Settings – CashFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{layout :: ownerNav}" th:with="activePage='settings'"></div>

<div class="main">
    <div class="page-header">
        <div class="page-title">Business Settings</div>
    </div>
    <div class="page-content">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div class="card" style="max-width:600px;">
            <div class="card-header">Business Information</div>
            <div class="card-body">
                <form th:action="@{/owner/settings/update}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-group">
                        <label class="form-label">Business Code (read-only)</label>
                        <input type="text" class="form-control" th:value="${salon.salonCode}" disabled
                               style="background:var(--bg); font-weight:700; letter-spacing:.1em;"/>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="fullName" class="form-control" th:value="${salon.fullName}" required/>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email (read-only)</label>
                        <input type="email" class="form-control" th:value="${salon.email}" disabled
                               style="background:var(--bg);"/>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="tel" name="phone" class="form-control" th:value="${salon.phone}"/>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Country</label>
                            <input type="text" class="form-control" th:value="${salon.country}" disabled style="background:var(--bg);"/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">City</label>
                            <input type="text" name="city" class="form-control" th:value="${salon.city}"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Address</label>
                        <input type="text" name="address" class="form-control" th:value="${salon.address}"/>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
