<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Owner Login – CashFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-box">
        <div class="auth-logo">
            <div class="brand-icon">💸</div>
            <div class="auth-logo-title">Cash Flow</div>
            <div class="auth-logo-sub">Owner Portal</div>
        </div>

        <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>
        <div th:if="${logoutMessage}" class="alert alert-info" th:text="${logoutMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success">
            <strong>🎉 Welcome to Cash Flow!</strong><br/>
            <span th:text="${successMessage}"></span><br/>
            <strong>Save your Code — employees will need it to log in.</strong>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="text" name="username" class="form-control"
                       placeholder="owner@domain.com" required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="••••••••" required/>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg mt-2">
                🔐 Sign In as Owner
            </button>
        </form>


        <p style="text-align:center; margin-top:20px; font-size:.88rem; color:var(--text-muted);">
            New business? <a th:href="@{/register}" style="color:var(--primary); font-weight:600;">Register here</a>
        </p>
    </div>
</div>

<footer class="auth-footer">
    <p>© 2026 <a href="https://proceedsystems.com/" target="_blank" rel="noopener noreferrer" class="auth-footer-link">proceedsystems.com</a> All rights reserved.</p>
</footer>

<style>
    .auth-page {
    min-height: 100vh;
    background: linear-gradient(135deg, #7c3aed, #4c1d95);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    position: relative;
}

.auth-footer {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
}

.auth-footer p {
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    margin: 0;
}

.auth-footer-link,
.auth-footer-link:visited {
    color: rgba(255,255,255,0.9);
    text-decoration: none;
}

.auth-footer-link:hover,
.auth-footer-link:focus {
    color: rgba(255,255,255,0.9);
    text-decoration: underline;
}
</style>
</body>
</html>
