<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register Your Business – CashFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <style>
        .auth-box { max-width: 560px; }
        .section-divider { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em;
                           color: var(--text-muted); margin: 20px 0 14px; font-weight: 600; }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-box">
        <div class="auth-logo">
            <div class="brand-icon">💸</div>
            <div class="auth-logo-title">Cash Flow</div>
            <div class="auth-logo-sub">Create your business account</div>
        </div>

        <div th:if="${emailError}" class="alert alert-danger" th:text="${emailError}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/register}" method="post" th:object="${salon}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="section-divider">👤 Owner Information</div>

            <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-control" th:field="*{fullName}"
                       placeholder="e.g. Company Name" required/>
                <span class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" class="form-control" th:field="*{email}"
                           placeholder="owner@domain.com" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number *</label>
                    <input type="tel" class="form-control" th:field="*{phone}"
                           placeholder="+1 555 000 0000" required/>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password *</label>
                <input type="password" class="form-control" th:field="*{password}"
                       placeholder="At least 8 characters" required minlength="8"/>
            </div>

            <div class="section-divider">📍 Location</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Country *</label>
                    <input type="text" class="form-control" th:field="*{country}"
                           placeholder="Lebanon" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">City *</label>
                    <input type="text" class="form-control" th:field="*{city}"
                           placeholder="Beirut" required/>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Address *</label>
                <input type="text" class="form-control" th:field="*{address}"
                       placeholder="123 Main Street, Downtown" required/>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg mt-2">
                🚀 Create Business Account
            </button>
        </form>

        <p style="text-align:center; margin-top:18px; font-size:.88rem; color:var(--text-muted);">
            Already have an account? <a th:href="@{/login}" style="color:var(--primary); font-weight:600;">Sign in</a>
        </p>
    </div>
</div>
</body>
</html>
