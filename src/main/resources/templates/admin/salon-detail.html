<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Salon Detail – Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body style="background:var(--bg);">
<div style="display:flex; min-height:100vh;">
  <div class="sidebar" style="background:#1a1a2e;">
    <div class="sidebar-brand"><div class="brand-icon">🛡️</div><span>Admin Panel</span></div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard" class="nav-item"><span class="nav-icon">←</span> Back to Salons</a>
    </nav>
  </div>

  <div class="main">
    <div class="page-header">
      <div>
        <div class="page-title" th:text="${salon.fullName}">Salon</div>
        <div class="page-subtitle" th:text="'Code: ' + ${salon.salonCode}">Code</div>
      </div>
      <span class="badge" th:classappend="${salon.active ? 'badge-success' : 'badge-danger'}"
            th:text="${salon.active ? 'Active' : 'Disabled'}" style="font-size:.9rem; padding:6px 14px;"></span>
    </div>

    <div class="page-content">
      <div class="grid-2">
        <!-- Salon Info -->
        <div class="card">
          <div class="card-header">Salon Info</div>
          <div class="card-body">
            <table style="width:100%; font-size:.9rem;">
              <tr><td class="text-muted" style="padding:6px 0; width:120px;">Email</td><td th:text="${salon.email}"></td></tr>
              <tr><td class="text-muted" style="padding:6px 0;">Phone</td><td th:text="${salon.phone}"></td></tr>
              <tr><td class="text-muted" style="padding:6px 0;">Country</td><td th:text="${salon.country}"></td></tr>
              <tr><td class="text-muted" style="padding:6px 0;">City</td><td th:text="${salon.city}"></td></tr>
              <tr><td class="text-muted" style="padding:6px 0;">Address</td><td th:text="${salon.address}"></td></tr>
              <tr><td class="text-muted" style="padding:6px 0;">POS URL</td>
                <td><code th:text="${posBaseUrl + '/pos?salon=' + salon.salonCode}"></code></td></tr>
            </table>
          </div>
        </div>

        <!-- Employees -->
        <div class="card">
          <div class="card-header">Employees (<span th:text="${employees.size()}">0</span>)</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Name</th><th>PIN</th><th>Role</th><th>Status</th></tr></thead>
              <tbody>
              <tr th:each="emp : ${employees}">
                <td th:text="${emp.name}">Name</td>
                <td><code th:text="${emp.pin}">PIN</code></td>
                <td><span class="badge badge-primary" th:text="${emp.role}">EMPLOYEE</span></td>
                <td><span class="badge" th:classappend="${emp.active ? 'badge-success' : 'badge-danger'}" th:text="${emp.active ? 'Active' : 'Off'}"></span></td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
