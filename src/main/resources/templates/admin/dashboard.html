<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Admin – SalonFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body style="background:var(--bg);">

<div style="display:flex; min-height:100vh;">
  <!-- Admin Sidebar -->
  <div class="sidebar" style="background:#1a1a2e;">
    <div class="sidebar-brand">
      <div class="brand-icon">🛡️</div>
      <span>Admin Panel</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard" class="nav-item active">
        <span class="nav-icon">🏢</span> All Salons
      </a>
    </nav>
    <div class="sidebar-footer">
      <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="nav-item logout-btn">
          <span class="nav-icon">🚪</span> Logout
        </button>
      </form>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="page-header">
      <div>
        <div class="page-title">All Salons</div>
        <div class="page-subtitle">Super Admin — SalonFlow Management</div>
      </div>
    </div>

    <div class="page-content">
      <div class="stats-grid" style="margin-bottom:24px;">
        <div class="stat-card">
          <div class="stat-icon">🏢</div>
          <div class="stat-label">Total Salons</div>
          <div class="stat-value" th:text="${totalSalons}">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-label">Active Salons</div>
          <div class="stat-value" th:text="${activeSalons}">0</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Registered Salons</div>
        <div class="table-wrap">
          <table>
            <thead>
            <tr>
              <th>Salon Code</th>
              <th>Name</th>
              <th>Owner Email</th>
              <th>Phone</th>
              <th>City</th>
              <th>Registered</th>
              <th>Status</th>
              <th>POS Link</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="salon : ${salons}">
              <td>
                <code style="background:var(--primary-lt); color:var(--primary); padding:3px 8px; border-radius:6px; font-weight:700;"
                      th:text="${salon.salonCode}">CODE</code>
              </td>
              <td class="fw-bold" th:text="${salon.fullName}">Name</td>
              <td class="text-muted" th:text="${salon.email}">email</td>
              <td class="text-muted" th:text="${salon.phone}">phone</td>
              <td th:text="${salon.city}">City</td>
              <td class="text-muted" th:text="${#temporals.format(salon.createdAt, 'MMM d yyyy')}">Date</td>
              <td>
                                    <span class="badge" th:classappend="${salon.active ? 'badge-success' : 'badge-danger'}"
                                          th:text="${salon.active ? 'Active' : 'Disabled'}">Active</span>
              </td>
              <td>
                <code style="font-size:.78rem;" th:text="${posBaseUrl + '/pos?salon=' + salon.salonCode}">link</code>
              </td>
              <td style="display:flex; gap:6px;">
                <a th:href="@{/admin/salon/{id}(id=${salon.id})}" class="btn btn-sm btn-outline">View</a>
                <form th:action="@{/admin/salon/{id}/toggle(id=${salon.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm"
                          th:classappend="${salon.active ? 'btn-danger' : 'btn-success'}"
                          th:text="${salon.active ? 'Disable' : 'Enable'}">Toggle</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
