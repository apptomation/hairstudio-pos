spring:
  application:
    name: SalonFlow
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/salonflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456789}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  thymeleaf:
    cache: false
  servlet:
    session:
      timeout: 8h

server:
  port: ${SERVER_PORT:8080}

app:
  pos-base-url: ${POS_BASE_URL:http://localhost:8080}
